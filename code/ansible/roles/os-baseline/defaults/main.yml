# Defaults for the os-baseline role.
#
# 32.1 owns the target state and 28.12 owns how it is enforced; these are the
# values that enforcement acts on. Override them in group_vars for a fleet that
# needs a different set -- do not edit the role.
#
# Package names below are Debian-family. On a RHEL-family image the audit
# daemon package is `audit`, not `auditd`; set os_baseline_packages in
# group_vars for those hosts rather than branching inside the role.
---
os_baseline_packages:
  - auditd
  - audispd-plugins

# Kernel parameters. Each is a hardening control that survives reboot because
# it is written to a drop-in under /etc/sysctl.d/ rather than set at runtime.
os_baseline_sysctls:
  # Do not act as a router. A workload instance forwarding packets is either a
  # misconfiguration or an attacker's pivot.
  - name: net.ipv4.ip_forward
    value: "0"
  # Ignore ICMP redirects: accepting them lets an on-link host rewrite routes.
  - name: net.ipv4.conf.all.accept_redirects
    value: "0"
  - name: net.ipv4.conf.all.send_redirects
    value: "0"
  # Source-routed packets choose their own return path. Refuse them.
  - name: net.ipv4.conf.all.accept_source_route
    value: "0"
  # Log packets with impossible source addresses.
  - name: net.ipv4.conf.all.log_martians
    value: "1"
  # Reverse-path filtering, strict mode.
  - name: net.ipv4.conf.all.rp_filter
    value: "1"
  # Restrict dmesg to root: kernel pointers leak through it.
  - name: kernel.dmesg_restrict
    value: "1"
  # A core dump from a setuid process can contain material the process was
  # trusted with and the user was not.
  - name: fs.suid_dumpable
    value: "0"

# Local accounts OS Login replaces. A local account with an authorized key is a
# credential that exists outside IAM and is invisible to an access review
# (8.19, 33.4). List the ones your images ship with.
os_baseline_absent_users: []
