# A Kubernetes ServiceAccount bound to a Google service account through Workload
# Identity Federation for GKE. 4.12 owns the identity mechanics and 9.11 owns the
# cluster configuration that turns it on.
#
# The binding is two-sided and BOTH sides are required:
#   1. this annotation, and
#   2. an IAM binding granting roles/iam.workloadIdentityUser on the Google
#      service account to the member
#      serviceAccount:PROJECT.svc.id.goog[NAMESPACE/KSA_NAME]
#
# With only the annotation the pod falls back to the node's identity, which is
# the failure this pattern exists to prevent -- and it fails silently.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-prod
  namespace: app-prod
  annotations:
    iam.gke.io/gcp-service-account: sa-app-prod@rc-saas-prod-app-01.iam.gserviceaccount.com
automountServiceAccountToken: false
